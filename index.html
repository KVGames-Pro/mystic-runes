<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
    <title>Mystic Runes</title>
    <style>
        body { margin: 0; padding: 0; background-color: #000; overflow: hidden; }
        canvas { width: 100%; height: 100%; display: block; }
    </style>
    
    <!-- Подключаем SDK Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Подключаем SDK Adsgram -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script src="mysticrunesmatch3.js"></script>
    <script>
        const engine = new Engine({"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"mysticrunesmatch3","experimentalVK":false,"fileSizes":{"mysticrunesmatch3.pck":77168868,"mysticrunesmatch3.wasm":37902138},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4});
        engine.startGame();

        // Расширяем игру на весь экран в Telegram
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
        Telegram.WebApp.disableVerticalSwipes();

        // Инициализация рекламы (ВСТАВЬ СВОЙ BLOCK ID СЮДА)
        const AdController = window.Adsgram.init({ blockId: "54975" });

        // Функция для показа рекламы из Godot с проверкой ошибок
function showTgAd(onSuccess, onError) {
    console.log("Godot запросил показ рекламы...");
    if (AdController) {
        AdController.show().then((result) => {
            console.log("УСПЕХ! Игрок досмотрел рекламу. Результат: ", result);
            onSuccess(); 
        }).catch((error) => {
            console.log("ОШИБКА или отмена показа рекламы: ", error);
            onError(); 
        });
    } else {
        console.log("ОШИБКА КРИТИЧЕСКАЯ: AdController не найден!");
        onError();
    }
}
    </script>
</body>
</html>

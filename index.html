<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
    <title>Mystic Runes</title>
    <style>
        body { margin: 0; padding: 0; background-color: #000; overflow: hidden; }
        canvas { width: 100%; height: 100%; display: block; }
    </style>
    
    <!-- Подключаем SDK Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Подключаем SDK Adsgram -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script src="index.js"></script>
    <script>
        const engine = new Engine({"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":33532456,"index.wasm":37902138},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4});
        engine.startGame();

        // Расширяем игру на весь экран в Telegram
        if (window.Telegram && Telegram.WebApp) {
            Telegram.WebApp.ready();
            Telegram.WebApp.expand();
            Telegram.WebApp.disableVerticalSwipes();
        }

        // Инициализация Adsgram с защитой от сбоев
        let AdController = null;
        
        function initAdsgram() {
            try {
                if (window.Adsgram && typeof window.Adsgram.init === 'function') {
                    // Убедитесь, что здесь указан ваш точный блок-ID из панели Adsgram
                    AdController = window.Adsgram.init({ blockId: "55150" });
                } else {
                    console.warn("Adsgram SDK не загрузился вовремя.");
                }
            } catch (e) {
                console.error("Ошибка инициализации Adsgram:", e);
            }
        }

        // Запускаем инициализацию сразу при загрузке
        initAdsgram();

        // Безопасная функция для показа рекламы из Godot
        function showTgAd(onSuccess, onError) {
            // Если контроллер по какой-то причине не инициализировался, пробуем еще раз
            if (!AdController) {
                initAdsgram();
            }

            if (AdController) {
                AdController.show().then((result) => {
                    if (typeof onSuccess === 'function') onSuccess();  
                }).catch((result) => {
                    console.warn("Реклама закрыта или произошла ошибка:", result);
                    if (typeof onError === 'function') onError();  
                });
            } else {
                console.error("AdController недоступен!");
                if (typeof onError === 'function') onError();
            }
        }
    </script>
</body>
</html>

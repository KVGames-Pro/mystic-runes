<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
    <title>Mystic Runes</title>
    <style>
        body { margin: 0; padding: 0; background-color: #000; overflow: hidden; }
        canvas { width: 100%; height: 100%; display: block; }
    </style>
    
    <!-- Подключаем SDK Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Подключаем SDK Adsgram -->
    <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
</head>
<body>
    <canvas id="canvas"></canvas>
    <script src="index.js"></script>
    <script>
        const engine = new Engine({"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":57860192,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4});
        engine.startGame();

        // Расширяем игру на весь экран в Telegram
        Telegram.WebApp.ready();
        Telegram.WebApp.expand();
        Telegram.WebApp.disableVerticalSwipes();

        // Инициализация рекламы (ВСТАВЬ СВОЙ BLOCK ID СЮДА)
        const AdController = window.Adsgram.init({ blockId: "55150" });

        // Функция для показа рекламы из Godot
        function showTgAd(onSuccess, onError) {
            if (AdController) {
                AdController.show().then((result) => {
                    onSuccess(); 
                }).catch((result) => {
                    onError(); 
                });
            } else {
                onError();
            }
        }
    </script>
</body>
</html>
